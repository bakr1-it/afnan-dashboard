<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- تدرج ذهبي فاخر للأطراف والزخارف -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE08B" />
      <stop offset="30%" stop-color="#E5B854" />
      <stop offset="70%" stop-color="#C6922A" />
      <stop offset="100%" stop-color="#F5D77F" />
    </linearGradient>

    <!-- قناع دائري لضمان أن كل شيء داخل الدائرة تماماً -->
    <clipPath id="circularClip">
      <circle cx="250" cy="250" r="235" />
    </clipPath>
  </defs>

  <!-- الخلفية الداكنة الدائرية الأساسية -->
  <circle cx="250" cy="250" r="240" fill="#0C1B2A" />

  <!-- الإطار الدائري الخارجي والداخلي (المزدوج) -->
  <circle cx="250" cy="250" r="232" fill="none" stroke="url(#goldGrad)" stroke-width="5" />
  <circle cx="250" cy="250" r="222" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.8" />

  <!-- محتويات الشعار مقيدة بالقناع الدائري -->
  <g clip-path="url(#circularClip)">
    
    <!-- هلال المئذنة والقبة في الأعلى -->
    <path d="M 252 82 A 9 9 0 1 1 248 98 A 7.5 7.5 0 1 0 252 82 Z" fill="url(#goldGrad)" />

    <!-- القبة العلوية للمسجد -->
    <path d="M 250 100 
             C 256 120, 285 135, 285 165 
             L 215 165 
             C 215 135, 244 120, 250 100 Z" fill="url(#goldGrad)" />

    <!-- الشرفة الدائرية أسفل القبة مباشرة -->
    <rect x="210" y="165" width="80" height="7" rx="3" fill="url(#goldGrad)" />

    <!-- جسم المبنى المركزي المفرغ / الأقواس المركزية -->
    <path d="M 222 172 L 222 245 L 278 245 L 278 172 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
    <!-- نافذة محراب القبة المركزية -->
    <path d="M 240 220 L 240 195 C 240 188, 260 188, 260 195 L 260 220 Z" fill="url(#goldGrad)" />

    <!-- المئذنة اليمينية -->
    <g id="min-right">
      <path d="M 330.5 132 A 4.5 4.5 0 1 1 328 140 A 3.8 3.8 0 1 0 330.5 132 Z" fill="url(#goldGrad)" />
      <path d="M 330 140 L 336 160 L 324 160 Z" fill="url(#goldGrad)" />
      <rect x="321" y="160" width="18" height="5" rx="2" fill="url(#goldGrad)" />
      <rect x="325" y="165" width="10" height="120" fill="url(#goldGrad)" opacity="0.95" />
      <rect x="321" y="225" width="18" height="4" rx="1.5" fill="url(#goldGrad)" />
      <rect x="319" y="280" width="22" height="6" rx="2" fill="url(#goldGrad)" />
    </g>

    <!-- المئذنة اليسارية -->
    <g id="min-left">
      <path d="M 170.5 132 A 4.5 4.5 0 1 1 168 140 A 3.8 3.8 0 1 0 170.5 132 Z" fill="url(#goldGrad)" />
      <path d="M 170 140 L 176 160 L 164 160 Z" fill="url(#goldGrad)" />
      <rect x="161" y="160" width="18" height="5" rx="2" fill="url(#goldGrad)" />
      <rect x="165" y="165" width="10" height="120" fill="url(#goldGrad)" opacity="0.95" />
      <rect x="161" y="225" width="18" height="4" rx="1.5" fill="url(#goldGrad)" />
      <rect x="159" y="280" width="22" height="6" rx="2" fill="url(#goldGrad)" />
    </g>

    <!-- البوابة والمحراب الإسلامي الكبير السفلي -->
    <path d="M 195 325 
             L 195 265 
             C 195 215, 250 195, 250 195 
             C 250 195, 305 215, 305 265 
             L 305 325 Z" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linejoin="round" />

    <!-- القوس الداخلي المتداخل -->
    <path d="M 210 325 
             L 210 273 
             C 210 235, 250 219, 250 219 
             C 250 219, 290 235, 290 273 
             L 290 325 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2" />

    <!-- قاعدة المحراب والأعمدة السفلية -->
    <line x1="140" y1="325" x2="360" y2="325" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
    <line x1="160" y1="332" x2="340" y2="332" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" />

    <!-- زخارف نقطية داخلية -->
    <circle cx="250" cy="255" r="4.5" fill="url(#goldGrad)" />
    <circle cx="250" cy="275" r="3" fill="url(#goldGrad)" />

    <!-- كتابة الاسم الإنجليزي AFNAN بشكل مريح يتلاءم مع انحناءة الدائرة -->
    <text x="250" y="415" font-family="&#39;Cinzel&#39;, &#39;Trajan Pro&#39;, &#39;Montserrat&#39;, &#39;Georgia&#39;, serif" font-size="52" font-weight="bold" letter-spacing="12" fill="url(#goldGrad)" text-anchor="middle">
      AFNAN
    </text>

    <!-- زخرفة خطية ذهبية بالأسفل تتبع الشكل الدائري -->
    <path d="M 180 442 L 230 442 M 270 442 L 320 442" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.75" />
    <polygon points="250,439 254,442 250,445 246,442" fill="url(#goldGrad)" />
  </g>
</svg>